# ════
# k8s/gcp/deployment.yaml — Manifiestos GKE para el laboratorio OTel
#
# Variables para envsubst:
#   PROJECT_ID      (ej: coastal-gantry-506317-k5)
#   REGION          (ej: us-central1)
#   AR_REPOSITORY   (ej: otel-lab)
#
# Pre-requisitos:
#   gcloud container clusters create otel-lab --region=us-central1 --num-nodes=3
#   kubectl create namespace otel-lab
#   kubectl config set-context --current --namespace=otel-lab
#
# Renderizar:
#   envsubst < deployment.yaml > deployment.rendered.yaml
#
# Aplicar:
#   kubectl apply -f deployment.rendered.yaml
# ════

---
# ServiceAccount para Workload Identity del Collector
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-sa
  namespace: otel-lab
  annotations:
    iam.gke.io/gcp-service-account: otel-collector@coastal-gantry-506317-k5.iam.gserviceaccount.com

---
# ConfigMap — Variables compartidas del entorno
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-lab-config
  namespace: otel-lab
data:
  ENVIRONMENT:               "production"
  CLOUD_PROVIDER:              "gcp"
  CLOUD_REGION:                "us-central1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-svc:4317"
  DATABASE_URL:                "postgresql://app:secret@postgres-svc:5432/appdb"
  GCP_PROJECT_ID:              "coastal-gantry-506317-k5"
  JAEGER_ENDPOINT:             "jaeger-svc:4317"

---
# ConfigMap para PostgreSQL init script
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: otel-lab
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS orders (
      id VARCHAR(50) PRIMARY KEY,
      product VARCHAR(50),
      quantity INT,
      status VARCHAR(50)
    );

    CREATE TABLE IF NOT EXISTS inventory (
      product_id VARCHAR(50) PRIMARY KEY,
      available INT,
      warehouse VARCHAR(50),
      last_updated TIMESTAMPTZ DEFAULT NOW()
    );

    INSERT INTO orders (id, product, quantity, status) VALUES
      ('ord-001', 'LAPTOP-X1', 1, 'delivered'),
      ('ord-002', 'PHONE-X2', 2, 'shipped')
    ON CONFLICT DO NOTHING;

    INSERT INTO inventory (product_id, available, warehouse) VALUES
      ('LAPTOP-X1', 15, 'WH-BOGOTA'),
      ('PHONE-X2', 8, 'WH-MEDELLIN')
    ON CONFLICT DO NOTHING;

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: otel-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              value: "secret"
            - name: POSTGRES_DB
              value: "appdb"
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "appdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: otel-lab
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# OTel Collector — DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: otel-lab
  labels:
    app: otel-collector
    component: observability
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector-sa
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.103.0
          args: ["--config=/conf/collector-config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics-internal
            - containerPort: 8889
              name: metrics-prom
            - containerPort: 13133
              name: health
          resources:
            requests:
              cpu:    100m
              memory: 200Mi
            limits:
              cpu:    500m
              memory: 500Mi
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: otel-lab-config
                  key: ENVIRONMENT
            - name: CLOUD_REGION
              valueFrom:
                configMapKeyRef:
                  name: otel-lab-config
                  key: CLOUD_REGION
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: otel-lab-config
                  key: GCP_PROJECT_ID
            - name: JAEGER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: otel-lab-config
                  key: JAEGER_ENDPOINT
          volumeMounts:
            - name: collector-config
              mountPath: /conf
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: collector-config
          configMap:
            name: collector-config

---
# Service para el OTel Collector
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-svc
  namespace: otel-lab
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8889
      targetPort: 8889
    - name: health
      port: 13133
      targetPort: 13133

---
# service-a Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: otel-lab
  labels:
    app: service-a
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
        version: "1.0.0"
    spec:
      containers:
        - name: service-a
          image: us-central1-docker.pkg.dev/coastal-gantry-506317-k5/otel-lab/service-a:1.0.0
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: otel-lab-config
          env:
            - name: SERVICE_B_URL
              value: "http://service-b-svc:8001"
            - name: OTEL_ENABLED
              value: "true"
          resources:
            requests:
              cpu:    100m
              memory: 128Mi
            limits:
              cpu:    500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

---
# service-a Service
apiVersion: v1
kind: Service
metadata:
  name: service-a-svc
  namespace: otel-lab
spec:
  selector:
    app: service-a
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: LoadBalancer

---
# service-b Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: otel-lab
  labels:
    app: service-b
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
        version: "1.0.0"
    spec:
      containers:
        - name: service-b
          image: us-central1-docker.pkg.dev/coastal-gantry-506317-k5/otel-lab/service-b:1.0.0
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: otel-lab-config
          env:
            - name: OTEL_ENABLED
              value: "true"
          resources:
            requests:
              cpu:    100m
              memory: 128Mi
            limits:
              cpu:    500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10

---
# service-b Service
apiVersion: v1
kind: Service
metadata:
  name: service-b-svc
  namespace: otel-lab
spec:
  selector:
    app: service-b
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP

---
# Jaeger Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: otel-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.58
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"

---
# Jaeger Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger-svc
  namespace: otel-lab
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
  type: LoadBalancer

---
# HorizontalPodAutoscaler — service-a
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-a-hpa
  namespace: otel-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-a
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
