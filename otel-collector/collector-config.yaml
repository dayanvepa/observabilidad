# ════
# OTel Collector — Pipeline completo de observabilidad
# Compatible con Docker Compose local y GKE (mediante JAEGER_ENDPOINT)
# ════

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["*"]

  prometheus:
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: ["localhost:8888"]

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
      disk:
      network:

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 0.5s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - action: insert
        key: deployment.environment
        value: ${env:ENVIRONMENT}
      - action: insert
        key: cloud.region
        value: ${env:CLOUD_REGION}
      - action: insert
        key: collector.version
        value: "0.103.0"

  resourcedetection:
    detectors: [env, gcp, system]
    timeout: 10s
    override: false

  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/health"'
        - 'attributes["http.route"] == "/health"'

  attributes/metrics:
    actions:
      - action: delete
        key: http.flavor
      - action: insert
        key: service.namespace
        value: "observability-lab"

exporters:
  otlp/jaeger:
    endpoint: ${env:JAEGER_ENDPOINT}
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otelcol
    send_timestamps: true
    metric_expiration: 3m
    resource_to_telemetry_conversion:
      enabled: true

  googlecloud:
    project: ${env:GCP_PROJECT_ID}
    log:
      default_log_name: "otel-lab"
    metric:
      prefix: "custom.googleapis.com/otel/"
    trace:
      endpoint: cloudtrace.googleapis.com

  logging:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

service:
  extensions: [health_check]

  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource
        - resourcedetection
        - filter/health
        - batch
      exporters:
        - otlp/jaeger
        - logging

    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors:
        - memory_limiter
        - resource
        - resourcedetection
        - attributes/metrics
        - batch
      exporters:
        - prometheus
        - logging

    logs:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource
        - batch
      exporters:
        - googlecloud
        - logging

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
      level: detailed
