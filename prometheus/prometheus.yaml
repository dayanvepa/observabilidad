storage:
  exemplars:
    max_exemplars: 100000    

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster:     otel-lab
    environment: production

scrape_configs:
  # OTel Collector expone las métricas de los microservicios
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector-svc:8889"]
    scrape_protocols:
      - OpenMetricsText1.0.0
      - OpenMetricsText0.0.1
      - PrometheusText0.0.4
    relabel_configs:
      - source_labels: [service_name]
        target_label: service

  - job_name: service-a-direct
    static_configs:
      - targets: ["otel-collector-svc:8889"]
    scrape_protocols:
      - OpenMetricsText1.0.0
      - OpenMetricsText0.0.1
      - PrometheusText0.0.4
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "python_gc.*"
        action: drop

  